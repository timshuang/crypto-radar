<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>币安 Alpha 全量推送测试</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { color: #f0a500; }
    .status { 
      padding: 10px; 
      margin: 10px 0; 
      border-radius: 5px;
      font-weight: bold;
    }
    .connected { background: #1b5e20; }
    .disconnected { background: #b71c1c; }
    .connecting { background: #f57f17; }
    button {
      background: #f0a500;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin: 5px;
    }
    button:hover { background: #ffc107; }
    button:disabled { background: #666; cursor: not-allowed; }
    .log {
      background: #0f0f23;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 15px;
      height: 400px;
      overflow-y: auto;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-item { margin: 5px 0; padding: 5px; border-bottom: 1px solid #222; }
    .log-time { color: #666; }
    .log-type { color: #f0a500; }
    .log-data { color: #4caf50; }
    .token-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }
    .token-card {
      background: #2a2a4e;
      padding: 10px;
      border-radius: 5px;
      border-left: 3px solid #f0a500;
    }
    .token-symbol { font-weight: bold; color: #f0a500; }
    .token-price { color: #4caf50; }
    .token-change { font-weight: bold; }
    .token-change.up { color: #4caf50; }
    .token-change.down { color: #f44336; }
  </style>
</head>
<body>
  <h1>🦐 币安 Alpha 全量推送测试</h1>
  
  <div>
    <strong>WebSocket URL:</strong> 
    <code>wss://nbstream.binance.com/w3w/wsa/stream</code>
  </div>
  
  <div>
    <strong>订阅流:</strong> 
    <code>came@allTokens@ticker24</code>
  </div>
  
  <div style="margin: 20px 0;">
    <button id="connectBtn" onclick="connect()">🔌 连接</button>
    <button id="disconnectBtn" onclick="disconnect()" disabled>❌ 断开</button>
    <button onclick="clearLog()">🧹 清空日志</button>
  </div>
  
  <div id="status" class="status disconnected">🔴 未连接</div>
  
  <div id="stats" style="display: none;">
    <h3>📊 实时统计</h3>
    <div>
      币种数量：<strong id="tokenCount">0</strong> |
      消息数量：<strong id="msgCount">0</strong> |
      最后更新：<strong id="lastUpdate">-</strong>
    </div>
    
    <h3>🪙 币种列表（前 50 个）</h3>
    <div id="tokenGrid" class="token-grid"></div>
  </div>
  
  <h3>📝 日志</h3>
  <div id="log" class="log"></div>
  
  <script>
    let ws = null;
    let msgCount = 0;
    let tokenMap = new Map();
    
    function log(type, message, data = null) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-type">${type}:</span> <span class="log-data">${message}</span>`;
      
      if (data) {
        const dataDiv = document.createElement('div');
        dataDiv.style.color = '#888';
        dataDiv.style.fontSize = '11px';
        dataDiv.textContent = JSON.stringify(data, null, 2);
        item.appendChild(dataDiv);
      }
      
      logDiv.insertBefore(item, logDiv.firstChild);
      
      // 限制日志数量
      while (logDiv.children.length > 100) {
        logDiv.removeChild(logDiv.lastChild);
      }
    }
    
    function updateStatus(status, text) {
      const statusDiv = document.getElementById('status');
      statusDiv.className = `status ${status}`;
      statusDiv.textContent = text;
    }
    
    function updateTokenGrid() {
      const grid = document.getElementById('tokenGrid');
      grid.innerHTML = '';
      
      let count = 0;
      for (const [id, token] of tokenMap.entries()) {
        if (count >= 50) break;
        
        const changeClass = token.pc24 >= 0 ? 'up' : 'down';
        const changeSign = token.pc24 >= 0 ? '+' : '';
        
        const card = document.createElement('div');
        card.className = 'token-card';
        card.innerHTML = `
          <div class="token-symbol">#${token.s}</div>
          <div class="token-price">$${parseFloat(token.p).toFixed(6)}</div>
          <div class="token-change ${changeClass}">${changeSign}${token.pc24}%</div>
        `;
        grid.appendChild(card);
        count++;
      }
      
      document.getElementById('tokenCount').textContent = tokenMap.size;
      document.getElementById('msgCount').textContent = msgCount;
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }
    
    function connect() {
      if (ws) {
        log('⚠️', '已连接，请先断开');
        return;
      }
      
      updateStatus('connecting', '🟡 连接中...');
      log('🔌', '正在连接...');
      
      ws = new WebSocket('wss://nbstream.binance.com/w3w/wsa/stream');
      
      ws.onopen = () => {
        updateStatus('connected', '🟢 已连接');
        log('✅', '连接成功！');
        
        // 发送订阅
        const subscribeMsg = {
          method: 'SUBSCRIBE',
          params: ['came@allTokens@ticker24'],
          id: Date.now()
        };
        
        ws.send(JSON.stringify(subscribeMsg));
        log('📡', '已发送订阅', subscribeMsg);
        
        document.getElementById('connectBtn').disabled = true;
        document.getElementById('disconnectBtn').disabled = false;
        document.getElementById('stats').style.display = 'block';
      };
      
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          msgCount++;
          
          // 订阅响应
          if (data.id !== undefined && data.result !== undefined) {
            log('📡', `订阅响应：result=${data.result}`, data);
            return;
          }
          
          // 全量推送数据
          if (data.data && data.data.d) {
            const tokens = data.data.d;
            
            // 更新币种映射
            for (const token of tokens) {
              tokenMap.set(token.s, token);
            }
            
            updateTokenGrid();
            
            if (msgCount <= 5 || msgCount % 50 === 1) {
              log('📦', `收到第 ${msgCount} 条消息，币种数：${tokens.length}`, {
                币种数: tokens.length,
                示例: tokens[0]
              });
            }
          }
        } catch (err) {
          log('❌', `解析错误：${err.message}`);
        }
      };
      
      ws.onerror = (err) => {
        log('❌', 'WebSocket 错误', err);
        updateStatus('disconnected', '🔴 错误');
      };
      
      ws.onclose = () => {
        log('🔌', '连接已关闭');
        updateStatus('disconnected', '🔴 已断开');
        ws = null;
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
      };
    }
    
    function disconnect() {
      if (ws) {
        ws.close();
        ws = null;
        log('🔌', '已主动断开连接');
      }
    }
    
    function clearLog() {
      document.getElementById('log').innerHTML = '';
      log('ℹ️', '日志已清空');
    }
    
    // 初始化日志
    log('ℹ️', '页面已加载，点击"连接"按钮开始测试');
  </script>
</body>
</html>
